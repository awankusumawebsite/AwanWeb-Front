name: Astro static CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [cms-content-changed]

concurrency:
  # GitHub keeps at most one running and one pending build for this group.
  # A newer CMS event replaces an older pending event without interrupting an
  # artifact that is already being built.
  group: astro-static-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  verify:
    name: Test, build, and validate static artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_BACKEND_URL: https://cms.awankusuma.com
      CMS_BUILD_TIMEOUT_MS: 10000
      MIGRATION_NOINDEX: true
      PUBLIC_ANALYTICS_ENABLED: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run validate:dist
      - uses: actions/upload-artifact@v4
        with:
          name: astro-static-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
